name: 🚀 Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  audit-and-lint:
    name: 🛡️ Security Audit & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📥 Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 🔒 Dependency Audit
        run: npm audit --audit-level=high || true

  unit-and-integration-tests:
    name: 🧪 Unit & Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ "20", "22" ]
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📥 Install Root Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 📥 Install Test Dependencies
        run: cd tests && npm install --legacy-peer-deps --no-audit --no-fund

      - name: ⚡ Run Vitest Capabilities Unit Suite
        run: npx vitest run tests/unit/capabilities.test.js

  docker-build-and-verify:
    name: 🐳 Docker Container Build & Verify
    runs-on: ubuntu-latest
    needs: [audit-and-lint, unit-and-integration-tests]
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: 9router-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  standalone-build-check:
    name: 📦 Next.js Standalone Build Verification
    runs-on: ubuntu-latest
    needs: [audit-and-lint]
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📥 Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 🏗️ Test Production Build
        run: npm run build

  e2e-tests:
    name: 🧪 E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 📥 Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 📥 Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 🏗️ Start application server
        run: npm run dev &
        env:
          BASE_URL: http://localhost:20127

      - name: ⏳ Wait for application readiness
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:20127/health; then
              echo "Application is ready"
              break
            fi
            echo "Waiting for application... ($i/30)"
            sleep 2
          done

      - name: ▶️ Run Playwright E2E suite
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:20127

      - name: 📂 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ github.run_id }}
          path: |
            tests/e2e/.playwright/
            tests/e2e/screenshots/
            tests/e2e/traces/
