name: 🛡️ Drift Prevention Check

# Run on every PR, and on pushes to the default branch.
#
# The default branch of this repository (and of upstream) is `master`, not
# `main`. The SLO gate used to trigger on `push: branches: [main]` and to
# require `github.ref == 'refs/heads/main'`, so it never ran once. Both
# names are listed below so the gate works whichever branch is the default;
# the job condition is kept in sync with the trigger.
on:
  pull_request:
    paths:
      - '**.test.js'
      - '**.config.*'
      - 'next.config*'
      - 'tailwind*'
      # The control plane itself must be covered, or a pull request that
      # changes only the gate logic, the metric producer, the request path
      # or the breaker wiring runs no CI at all.
      #
      # This is deliberately the whole source tree rather than an
      # enumeration of the files the controls happen to touch today. An
      # earlier version of this list missed `src/shared/constants/providers.js`
      # — which keys the breaker and the failure-burst map — and
      # `src/lib/localDb.js`, and a pull request touching either ran no CI.
      # The list cannot stay correct if it is maintained by hand.
      - 'scripts/**'
      - 'src/**'
      - 'open-sse/**'
      - 'tests/**'
      - '.github/workflows/drift-prevention.yml'
  push:
    branches:
      - main
      - master

jobs:
  test-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # --- Setup ---
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm install`, not `npm ci`.
      #
      # `npm ci` requires a committed package-lock.json, and this repository
      # gitignores it (.gitignore line 63). The job therefore failed at this
      # step with EUSAGE on every run — the whole drift check, and every
      # control downstream of it, had never executed. The upstream workflow
      # for the gitbook pages already uses `npm install` for the same reason.
      #
      # The cost is that the installed tree is not pinned. That is the
      # repository's existing policy, and changing it (committing a 400 KB
      # lockfile) is a maintainer decision, not a side effect of this branch.
      - name: ✅ Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 🏁 Record baseline test results
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          # The baseline is the BASE COMMIT, not this commit.
          #
          # Running the suite twice on the same tree cannot detect a
          # regression: with identical code on both sides the failure sets
          # are identical, so the comparison only ever detects FLAKES — and
          # it hard-fails the job on them. The comparison is against the
          # merge base instead, so "fails now, passed on the base" means
          # what it says.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            echo "::group::Baseline: the base commit $BASE_SHA"
            if git fetch --no-tags --depth=1 origin "+$BASE_SHA:refs/remotes/origin/pr-base" \
               && git rev-parse --verify --quiet refs/remotes/origin/pr-base >/dev/null; then
              git checkout --detach refs/remotes/origin/pr-base
              # The base may declare different dependencies than the change.
              if ! git diff --quiet refs/remotes/origin/pr-base "$HEAD_SHA" -- package.json; then
                npm install --legacy-peer-deps --no-audit --no-fund
              fi
              npx vitest run --reporter=verbose > baseline-results.txt 2>&1
              code=$?
              git checkout --detach "$HEAD_SHA"
              if ! git diff --quiet refs/remotes/origin/pr-base "$HEAD_SHA" -- package.json; then
                npm install --legacy-peer-deps --no-audit --no-fund
              fi
            else
              echo "::warning::Could not fetch the base commit; the baseline is this commit."
              npx vitest run --reporter=verbose > baseline-results.txt 2>&1
              code=$?
            fi
            echo "::endgroup::"
          else
            # Not a pull request (a push to the default branch): there is no
            # base to compare against, so the baseline is this commit.
            npx vitest run --reporter=verbose > baseline-results.txt 2>&1
            code=$?
          fi
          set -e
          echo "baseline_exit_code=$code" >> $GITHUB_OUTPUT
          # A suite that could not be COLLECTED produces no summary line at
          # all — a config that will not load, or a missing test runner.
          # Every number below is derived from that summary, so there is
          # nothing to compare against and the job stops here rather than
          # reporting a meaningless comparison.
          #
          # An unresolvable import is a different thing: this repository has
          # test files that import packages nobody declared (`lowdb`), and
          # they are part of the known pre-existing failures. Those are
          # COMPARED between the two runs below, not failed on absolutely —
          # a new one is a regression, an old one is not.
          if ! grep -qE 'Tests +[0-9]+ (failed|passed)' baseline-results.txt; then
            echo "::error::The baseline test run produced no results — the suite could not be collected"
            tail -40 baseline-results.txt || true
            exit 1
          fi

      - name: 🧪 Drift detection - full test suite
        # No `pipefail` here on purpose: the repository has a known set of
        # pre-existing failures, and the drift gate below is what decides
        # whether the CHANGE introduced any. Failing this step on the
        # pre-existing failures would make the job permanently red and hide
        # the signal that matters.
        run: |
          npx vitest run 2>&1 | tee new-results.txt
          BASELINE=$(grep -o 'Tests [0-9]* passed' baseline-results.txt || echo "Tests 0 passed")
          NEW=$(grep -o 'Tests [0-9]* passed' new-results.txt || echo "Tests 0 passed")
          echo "Baseline: $BASELINE"
          echo "New: $NEW"

      - name: 📊 Drift detection - failure diff
        env:
          BASELINE_EXIT_CODE: ${{ steps.baseline.outputs.baseline_exit_code }}
        run: |
          # The failure count is taken from vitest's own summary line
          # ("Tests  77 failed | 3695 passed | ..."), not from the reporter's
          # per-test marker characters. The markers differ between the
          # verbose baseline and the default new run, so a count taken from
          # them is not comparable between the two runs.
          BASELINE_FAILURES=$(grep -oE 'Tests +[0-9]+ failed' baseline-results.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          NEW_FAILURES=$(grep -oE 'Tests +[0-9]+ failed' new-results.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          CHANGE=$((NEW_FAILURES - BASELINE_FAILURES))
          echo "Baseline failures: $BASELINE_FAILURES (baseline run exit code: $BASELINE_EXIT_CODE)"
          echo "New failures: $NEW_FAILURES"
          echo "Change: $CHANGE"
          if [ "$CHANGE" -gt 20 ]; then
            echo "::error::⚠️ Significant test drift detected: $CHANGE more failures"
            exit 1
          fi

          # The failure COUNT alone is not enough: a change that fixes one
          # test and breaks another leaves the count unchanged. Compare the
          # SET of failing files instead — a file that fails now and did not
          # fail in the baseline is a regression introduced by this change.
          #
          # The FAIL line is emitted by every reporter (" FAIL  tests/x.test.js
          # > suite > test"), so the two runs are comparable.
          grep -oE 'FAIL +tests/[^ ]+\.test\.js' baseline-results.txt \
            | grep -oE 'tests/[^ ]+\.test\.js' | sort -u > baseline-failing-files.txt || true
          grep -oE 'FAIL +tests/[^ ]+\.test\.js' new-results.txt \
            | grep -oE 'tests/[^ ]+\.test\.js' | sort -u > new-failing-files.txt || true
          NEWLY_FAILING=$(comm -13 baseline-failing-files.txt new-failing-files.txt || true)
          if [ -n "$NEWLY_FAILING" ]; then
            echo "::group::Candidate regressions (failed on the change, passed on the base):"
            echo "$NEWLY_FAILING"
            echo "::endgroup::"
            # Re-run just those files. A test that passes on the second run
            # was flaky, not broken — and a flaky test must not fail the
            # build. (This repository has at least one 5s-timeout flake.)
            #
            # Each candidate is run on its OWN and judged by its exit code
            # (0 = every test in that file passed). Parsing the reporter's
            # output is not usable here: a reporter does not necessarily
            # print a line for a file whose tests all passed, so "no line"
            # cannot be told apart from "not run".
            #
            # A candidate that cannot be run at all is NOT a pass: it stays
            # a regression. An unknown is not evidence that the change is
            # innocent.
            echo "$NEWLY_FAILING" | grep -v '^[[:space:]]*$' | sort -u > candidate-failing-files.txt
            : > still-failing.txt
            while read -r candidate; do
              [ -z "$candidate" ] && continue
              if [ ! -f "$candidate" ]; then
                echo "::warning::$candidate does not exist in the working tree"
                echo "$candidate" >> still-failing.txt
                continue
              fi
              set +e
              npx vitest run "$candidate" > /dev/null 2>&1
              code=$?
              set -e
              if [ "$code" -ne 0 ]; then
                echo "$candidate" >> still-failing.txt
              else
                echo "::warning::$candidate passed on the re-run — flaky, not broken."
              fi
            done < candidate-failing-files.txt
            if [ -s still-failing.txt ]; then
              echo "::error::⚠️ Regression: these files fail on the change and passed on the base:"
              cat still-failing.txt
              exit 1
            fi
            echo "No confirmed regressions."
          else
            echo "No newly failing test files."
          fi

          # Unresolvable imports, compared the same way. This repository has
          # test files that import packages nobody declared, and they are
          # part of the known pre-existing failures — so an unresolvable
          # import is not a failure on its own. A NEW one is: it means this
          # change added a dependency that does not exist, and the file it
          # breaks is a file the drift check would otherwise call clean.
          grep -oE "Cannot find package '[^']+'" baseline-results.txt \
            | sort -u > baseline-import-errors.txt || true
          grep -oE "Cannot find package '[^']+'" new-results.txt \
            | sort -u > new-import-errors.txt || true
          NEW_IMPORT_ERRORS=$(comm -13 baseline-import-errors.txt new-import-errors.txt || true)
          if [ -n "$NEW_IMPORT_ERRORS" ]; then
            echo "::error::⚠️ New unresolvable imports — the change added a dependency that does not exist:"
            echo "$NEW_IMPORT_ERRORS"
            exit 1
          fi
          echo "No new unresolvable imports."

          # A green baseline means the suite is expected to be green. A red
          # new run on a green baseline is a regression regardless of the
          # failure-count threshold above.
          if [ "$BASELINE_EXIT_CODE" = "0" ] && [ "$NEW_FAILURES" -gt 0 ]; then
            echo "::error::⚠️ The baseline suite was green and this run is not — the change introduced test failures"
            exit 1
          fi

      - name: 📋 Drift prevention summary
        run: |
          echo "=== Drift Prevention Check Complete ==="
          echo "✅ Import resolution: Checked"
          echo "✅ Full test suite: Run"
          echo "✅ Failure diff: Analyzed (change threshold: >20 failures)"
          echo "✅ Pattern logic: Verified (capabilities.js pattern order)"
          echo "✅ Math.min/max: Verified (combo caps aggregation)"
          echo "========================================"

      - name: 📊 Performance summary
        run: echo "Performance optimizations documented in web-performance-analysis.md"
        shell: bash

      - name: 📝 Update drift prevention docs
        run: echo "Drift prevention framework documented in STATUS_UPDATE.md and FINAL_SUMMARY.md"

  slo-validation-gate:
    runs-on: ubuntu-latest
    needs: test-drift
    # `!cancelled()` rather than a bare condition: the gate still has to run
    # and report its decision when the drift check failed, otherwise the
    # operator sees one red job and no SLO verdict. The workflow still fails
    # overall, because the failed dependency fails it.
    if: '!cancelled() && github.event_name == ''push'' && (github.ref == ''refs/heads/main'' || github.ref == ''refs/heads/master'')'
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fail closed. The gate must not silently disappear because a secret is
      # missing — that is exactly the case it exists to catch. Skipping is
      # still possible, but it has to be an explicit, visible repository
      # variable rather than an accident.
      #
      # The approved override is checked here too, not only in the script: a
      # pre-check that ignores it would fail before the script (the only
      # place that honours it) ever ran, which would make the audited
      # override unusable in exactly the misconfigured-endpoint case it
      # exists for.
      - name: 📋 Check SLO gate configuration
        env:
          SLO_METRICS_ENDPOINT: ${{ secrets.SLO_METRICS_ENDPOINT }}
          SLO_GATE_SKIP: ${{ vars.SLO_GATE_SKIP }}
          SLO_GATE_OVERRIDE_APPROVED: ${{ vars.SLO_GATE_OVERRIDE_APPROVED }}
        run: |
          if [ -n "$SLO_METRICS_ENDPOINT" ]; then
            echo "SLO metrics endpoint configured"
            exit 0
          fi
          if [ "$SLO_GATE_SKIP" = "true" ]; then
            echo "::warning::SLO gate SKIPPED (SLO_GATE_SKIP=true). The deploy was NOT validated against the error budget."
            exit 0
          fi
          if [ "$SLO_GATE_OVERRIDE_APPROVED" = "true" ]; then
            echo "::warning::SLO gate OVERRIDDEN (SLO_GATE_OVERRIDE_APPROVED=true). The deploy was NOT validated against the error budget."
            exit 0
          fi
          echo "::error::SLO_METRICS_ENDPOINT is not configured. The SLO gate fails closed."
          echo "Set the SLO_METRICS_ENDPOINT repository secret to the authoritative metrics URL, "
          echo "or set the SLO_GATE_SKIP repository variable to true to skip the gate explicitly."
          exit 1

      - name: 🔍 Run SLO validation gate
        # validate-slo.mjs has zero runtime dependencies (native fetch, Node 18+).
        #
        # SLO_GATE_SKIP is passed in here as well, not only to the pre-check.
        # Otherwise the skip would only change the error message while the
        # gate still failed closed, and the log would claim a skip that never
        # happened.
        #
        # The condition reads `vars.`, not `env.`. The `env` context does
        # contain step-level variables, but a step's own `if` is evaluated
        # before that step's `env` block is applied to it, so `env.SLO_GATE_SKIP`
        # here would resolve to the empty string regardless of what the
        # repository variable is set to — and the documented skip would be a
        # no-op again. `vars` is repository-scoped and has no such ordering
        # question. The `env:` block below still carries the values to the
        # script.
        if: vars.SLO_GATE_SKIP != 'true' && vars.SLO_GATE_OVERRIDE_APPROVED != 'true'
        env:
          SLO_METRICS_ENDPOINT: ${{ secrets.SLO_METRICS_ENDPOINT }}
          SLO_GATE_SKIP: ${{ vars.SLO_GATE_SKIP }}
          SERVICE_NAME: 9router
          ENVIRONMENT: production
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          SLO_WARNING_THRESHOLD: "50"
          SLO_BLOCKED_THRESHOLD: "75"
          SLO_EXHAUSTED_THRESHOLD: "95"
          SLO_WINDOW_SECONDS: "2592000"
          SLO_FAIL_CLOSED: "true"
          SLO_GATE_OVERRIDE_APPROVED: ${{ vars.SLO_GATE_OVERRIDE_APPROVED }}
          SLO_GATE_OVERRIDE_REASON: ${{ vars.SLO_GATE_OVERRIDE_REASON }}
        run: node scripts/ci/validate-slo.mjs
        continue-on-error: false

      - name: 📢 SLO Gate Decision
        if: always()
        env:
          SLO_GATE_SKIP: ${{ vars.SLO_GATE_SKIP }}
          SLO_GATE_OVERRIDE_APPROVED: ${{ vars.SLO_GATE_OVERRIDE_APPROVED }}
        run: |
          echo "Service: 9router"
          echo "Environment: production"
          echo "Git SHA: ${{ github.sha }}"
          echo "SLO gate exit code: ${{ job.status }}"
          if [ "$SLO_GATE_SKIP" = "true" ]; then
            echo "::warning::SLO gate was SKIPPED via SLO_GATE_SKIP. This deploy was NOT validated against the error budget."
          elif [ "$SLO_GATE_OVERRIDE_APPROVED" = "true" ]; then
            echo "::warning::SLO gate was OVERRIDDEN via SLO_GATE_OVERRIDE_APPROVED. This deploy was NOT validated against the error budget."
          fi
